name: Release

# Builds the self-contained tarballs on Linux (so file permissions are preserved) whenever a
# version tag is pushed, and attaches them to the GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.6.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ComposeWellness.sln --configuration Release

      - name: Publish ${{ matrix.rid }}
        run: bash ./deploy/publish.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: compose-wellness-${{ matrix.rid }}
          path: dist/compose-wellness-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/SHA256SUMS --clobber
          else
            gh release create "$TAG" artifacts/*.tar.gz artifacts/SHA256SUMS --title "$TAG" --generate-notes
          fi
